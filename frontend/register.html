<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes" />
  <title>NearBuy - Create Account</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="style/register.css">

</head>
<body>

<div class="app">
  <div class="hero">
    <div class="brand-row">
      <img src="images/logo.png" class="brand-logo-img" alt="NearBuy Logo" onerror="this.src='https://via.placeholder.com/42x42?text=NB'">
      <div class="brand-name">NEARBUY</div>
    </div>
    <h2>Create Account</h2>
    <p>Join the trusted marketplace today</p>
  </div>

  <div class="card">
    <div class="form-header">
      <i class="fas fa-user-plus"></i>
      <h3>Register</h3>
      <p>Create your account to continue</p>
    </div>

    <div class="input-field">
      <label><i class="fas fa-user"></i> Full Name</label>
      <input type="text" id="registerName" placeholder="Enter full name" autocomplete="name">
    </div>

    <div class="input-field">
      <label><i class="fas fa-envelope"></i> Email Address</label>
      <input type="email" id="registerEmail" placeholder="Enter email" autocomplete="email">
    </div>

    <div class="input-field">
      <label><i class="fas fa-phone"></i> Phone Number</label>
      <input type="tel" id="registerPhone" placeholder="Enter phone number" autocomplete="tel">
    </div>

    <div class="input-field">
      <label><i class="fas fa-lock"></i> Password</label>
      <input type="password" id="registerPassword" placeholder="Enter password" autocomplete="new-password">
    </div>

    <div class="input-field">
      <label><i class="fas fa-check-circle"></i> Confirm Password</label>
      <input type="password" id="registerConfirmPassword" placeholder="Confirm password" autocomplete="new-password">
    </div>

    <button class="btn btn-primary" id="registerBtn">
      Create Account <i class="fas fa-arrow-right"></i>
    </button>

    <div class="divider"><span>OR SIGN UP WITH</span></div>

    <div class="social-group">
      <button class="social-btn google-btn" id="googleRegisterBtn">
        <i class="fab fa-google"></i> Google
      </button>
      <button class="social-btn facebook-btn" id="facebookRegisterBtn">
        <i class="fab fa-facebook-f"></i> Facebook
      </button>
    </div>

    <div class="footer-link">
      Already have an account? <a href="login.html">Sign In</a>
    </div>

    <div id="registerMessage" class="message-toast"></div>
  </div>
</div>

<script src="js/register.js">
</script>
</body>
</html>
